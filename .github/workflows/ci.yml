name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Coverage
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: CRAP report (threshold 8; report-only)
        shell: bash
        run: |
          # Append the built CLI's Markdown report (--format markdown) to
          # $GITHUB_STEP_SUMMARY as valid GitHub Markdown.
          #
          # Report-only semantics:
          # - exit 2 is the expected threshold breach: the report is published;
          # - any other nonzero exit fails the job, its stderr stays in the job
          #   log, and nothing is appended to the summary (no misleading
          #   success report).
          {
            echo "> ⚠️ **Temporary policy:** CRAP violations above the default threshold of 8 are reported, not enforced. The self-score audit below uses a temporary threshold of 30 while the CLI is refactored."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          report_output="$(mktemp)"
          trap 'rm -f "$report_output"' EXIT

          set +e
          node dist/cli.js src --coverage coverage/coverage-final.json --threshold 8 --format markdown > "$report_output"
          status=$?
          set -e

          if [[ "$status" -eq 0 || "$status" -eq 2 ]]; then
            cat "$report_output" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            if [[ "$status" -eq 2 ]]; then
              {
                echo
                echo "> ℹ️ The threshold-8 report exited 2 as expected; violations are report-only for now."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "CRAP report failed unexpectedly with exit $status; report follows:" >&2
            cat "$report_output" >&2
            exit "$status"
          fi

      - name: Self-score (assert expected threshold breach)
        run: npm run self-score
        # The self-score script (scripts/self-score.ts, run via tsx) asserts
        # that the CLI exits 2 (threshold exceeded) when run against this
        # repo's own source and coverage. The breach is expected: cli.ts
        # functions (parseArgs, main) have high cyclomatic complexity and no
        # direct test coverage (they are exercised via subprocess in tests,
        # which V8 does not attribute to the source file). The script exits 0
        # only when the expected breach occurs; it exits non-zero if the CLI
        # exits 0 (no breach — coverage missing), exits 1 (invalid input), or
        # produces any other unexpected error. This replaces the previous
        # bare `continue-on-error: true` which masked all failures.
