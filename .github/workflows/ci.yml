name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Coverage
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: CRAP report (threshold 8; report-only)
        shell: bash
        run: |
          # Buffer the COMPLETE candidate summary (policy block + Markdown
          # report + expected-exit note) in a temp file. Only after the CLI
          # exits 0 or 2 do we append it to $GITHUB_STEP_SUMMARY, so an
          # unexpected exit leaves an initially populated summary untouched.
          #
          # Report-only semantics:
          # - exit 2 is the expected threshold breach: the report is published;
          # - any other nonzero exit fails the job: nothing is appended to the
          #   summary and captured output goes only to stderr/job log.
          candidate_summary="$(mktemp)"
          report_output="$(mktemp)"
          trap 'rm -f "$candidate_summary" "$report_output"' EXIT

          {
            echo "> ⚠️ **Temporary policy:** CRAP violations above the default threshold of 8 are reported, not enforced in CI. The self-score audit below enforces the repository's own threshold 8 and passes only when zero own-source rows have a CRAP score strictly above it."
            echo
          } > "$candidate_summary"

          set +e
          node dist/cli.js src --coverage coverage/coverage-final.json --threshold 8 --format markdown > "$report_output"
          status=$?
          set -e

          if [[ "$status" -eq 0 || "$status" -eq 2 ]]; then
            cat "$report_output" >> "$candidate_summary"
            echo >> "$candidate_summary"
            if [[ "$status" -eq 2 ]]; then
              {
                echo
                echo "> ℹ️ The threshold-8 report exited 2 as expected; violations are report-only for now."
              } >> "$candidate_summary"
            fi
            cat "$candidate_summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CRAP report failed unexpectedly with exit $status; report follows:" >&2
            cat "$report_output" >&2
            exit "$status"
          fi

      - name: Self-score (own-source gate at threshold 8)
        run: npm run self-score
        # The self-score script (scripts/self-score.ts, run via tsx) runs the
        # real source CLI (tsx src/cli.ts) against this repo's own src/ with
        # the fresh coverage/coverage-final.json at --threshold 8 --json and
        # validates the JSON report fail closed: the coverage must exist and
        # be fresh, the report must be a structurally valid own-source result
        # of the current tree, and its summary must be re-verified against
        # the rows. It passes (exit 0) only when no row's CRAP score is
        # strictly above threshold 8; otherwise it prints every breached row
        # and exits 1. It exits non-zero on missing/stale coverage,
        # uninterpretable CLI results, or an unprovable report. The retired
        # premise — that the gate expects a threshold-30 breach with
        # parseArgs/main rows — no longer applies: the threshold-8
        # remediation left the own-source report clean.
