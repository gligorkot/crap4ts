name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Coverage
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: CRAP report (threshold 8; report-only)
        shell: bash
        run: |
          {
            echo "## CRAP report (threshold 8; report-only)"
            echo
            echo "> ⚠️ **Temporary policy:** CRAP violations above the default threshold of 8 are reported, not enforced. The self-score audit below uses a temporary threshold of 30 while the CLI is refactored."
            echo
            echo '```text'
          } >> "$GITHUB_STEP_SUMMARY"

          set +e
          node dist/cli.js src --coverage coverage/coverage-final.json --threshold 8 >> "$GITHUB_STEP_SUMMARY" 2>&1
          status=$?
          set -e

          {
            echo '```'
            echo
            if [[ "$status" -eq 2 ]]; then
              echo "> ℹ️ The threshold-8 report exited 2 as expected; violations are report-only for now."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$status" -ne 0 && "$status" -ne 2 ]]; then
            exit "$status"
          fi

      - name: Self-score (assert expected threshold breach)
        run: npm run self-score
        # The self-score script (scripts/self-score.ts, run via tsx) asserts
        # that the CLI exits 2 (threshold exceeded) when run against this
        # repo's own source and coverage. The breach is expected: cli.ts
        # functions (parseArgs, main) have high cyclomatic complexity and no
        # direct test coverage (they are exercised via subprocess in tests,
        # which V8 does not attribute to the source file). The script exits 0
        # only when the expected breach occurs; it exits non-zero if the CLI
        # exits 0 (no breach — coverage missing), exits 1 (invalid input), or
        # produces any other unexpected error. This replaces the previous
        # bare `continue-on-error: true` which masked all failures.
