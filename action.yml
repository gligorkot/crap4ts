name: "crap4ts CRAP report"
description: "Writes a Markdown CRAP report from existing Istanbul coverage to the GitHub Actions job summary."

branding:
  icon: "bar-chart-2"
  color: "purple"

inputs:
  coverage:
    description: "Path to the Istanbul coverage-final.json"
    required: false
    default: "coverage/coverage-final.json"
  src:
    description: "Source directory to analyze"
    required: false
    default: "src"
  threshold:
    description: "CRAP failure threshold"
    required: false
    default: "8"
  with-table:
    description: "Include the per-function Markdown table in the job summary"
    required: false
    default: "false"

outputs:
  breached-count:
    description: "Number of functions whose CRAP exceeds the threshold"
    value: ${{ steps.report.outputs.breached-count }}
  max-crap:
    description: "Maximum CRAP score across analyzed functions"
    value: ${{ steps.report.outputs.max-crap }}
  pass:
    description: '"true" when no threshold was breached, otherwise "false"'
    value: ${{ steps.report.outputs.pass }}

runs:
  using: "composite"
  steps:
    - id: report
      shell: bash
      env:
        COVERAGE_FILE: ${{ inputs.coverage }}
        SOURCE_PATH: ${{ inputs.src }}
        CRAP_THRESHOLD: ${{ inputs.threshold }}
        WITH_TABLE: ${{ inputs.with-table }}
      run: |
        set -euo pipefail

        # Run ONLY the locally installed CLI binary. No PATH/global lookup,
        # no npx, no npm install, no fetching of any kind.
        CLI="$GITHUB_WORKSPACE/node_modules/.bin/crap4ts"
        if [[ ! -x "$CLI" ]]; then
          echo "::error::crap4ts CLI not found at $CLI. Install it first with 'npm install --save-dev @gligor/crap4ts' before using this action."
          exit 1
        fi

        if [[ ! -f "$COVERAGE_FILE" ]]; then
          echo "::error::Coverage file not found: $COVERAGE_FILE. Generate coverage before calling this action."
          exit 1
        fi

        if [[ ! -w "${GITHUB_STEP_SUMMARY:-/dev/null}" ]]; then
          echo "::error::GITHUB_STEP_SUMMARY is not set or not writable; this action requires a GitHub Actions runner environment."
          exit 1
        fi

        json_file="$(mktemp)"
        trap 'rm -f "$json_file"' EXIT

        # Exit code 2 means the threshold was breached — expected here.
        # Any other non-zero status propagates unchanged.
        set +e
        "$CLI" "$SOURCE_PATH" \
          --coverage "$COVERAGE_FILE" \
          --threshold "$CRAP_THRESHOLD" \
          --format json > "$json_file"
        status=$?
        set -e

        if [[ "$status" -ne 0 && "$status" -ne 2 ]]; then
          echo "::error::crap4ts failed with exit code $status"
          exit "$status"
        fi

        # Write job outputs from the JSON produced by the single CLI run.
        breached="$(node -e 'process.stdout.write(String(JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).summary.breachedCount))' "$json_file")"
        max_crap="$(node -e 'process.stdout.write(Number(JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).summary.maxCrap).toFixed(1))' "$json_file")"
        {
          echo "breached-count=$breached"
          echo "max-crap=$max_crap"
          if [[ "$breached" == "0" ]]; then echo "pass=true"; else echo "pass=false"; fi
        } >> "${GITHUB_OUTPUT:?GITHUB_OUTPUT is not set}"

        # Render the Markdown summary from the same JSON so both formats come
        # from a single successful run. The renderer comes from the already
        # installed scoped package — an action checkout does not ship dist/.
        REPORT_CJS="$GITHUB_WORKSPACE/node_modules/@gligor/crap4ts/dist/cjs/report.js"
        if [[ ! -f "$REPORT_CJS" ]]; then
          echo "::error::Renderer not found at $REPORT_CJS. Install @gligor/crap4ts as a dev dependency before using this action."
          exit 1
        fi
        JSON_FILE="$json_file" REPORT_CJS="$REPORT_CJS" node -e '
          const { appendFileSync, readFileSync } = require("node:fs");
          const { renderMarkdownReport } = require(process.env.REPORT_CJS);
          const report = JSON.parse(readFileSync(process.env.JSON_FILE, "utf8"));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, renderMarkdownReport(report, {
            withTable: process.env.WITH_TABLE === "true",
          }) + "\n\n");
        '

        exit "$status"
